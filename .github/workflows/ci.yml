name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26"

jobs:
  # ── 1. Lint, type check, tests, dependency audit ─────────────────────────
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml

  # ── 3. Image: build, start it against a database and smoke-test it, then publish ──
  # The public repository publishes the core edition (ghcr.io/cyberriskcanvas/cyberriskcanvas-app);
  # in the private Pro repository this job only checks, the image is published by release.yml.
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [checks]
    permissions:
      contents: read
      packages: write
    env:
      EDITION: ${{ github.repository == 'cyberriskcanvas/cyberriskcanvas-pro' && 'pro' || 'core' }}
      IMAGE: ghcr.io/cyberriskcanvas/cyberriskcanvas-app
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crc
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crc" --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      # The runner has about 14 GB free; the image build, its layer cache and node_modules for the smoke test need more
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h / | tail -1

      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: crc:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the image
        run: |
          docker run -d --name crc --network host \
            -e DATABASE_URL -e AUTH_SECRET=smoke -e AUTH_TRUST_HOST=true \
            -e ADMIN_EMAIL=smoke@example.com -e ADMIN_PASSWORD=Smoke-test-1 -e CVE_SCAN_INTERVAL_HOURS=0 \
            crc:ci
          for i in $(seq 1 90); do curl -sf -o /dev/null http://localhost:3000/login && exit 0; sleep 2; done
          docker logs crc
          exit 1

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Smoke test (${{ env.EDITION }} edition)
        run: |
          npm install -g yarn && yarn install --frozen-lockfile --ignore-scripts
          node scripts/smoke.mjs "$EDITION"

      - name: Container log on failure
        if: failure()
        run: docker logs crc

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.repository == 'cyberriskcanvas/cyberriskcanvas-app'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: github.event_name == 'push' && github.repository == 'cyberriskcanvas/cyberriskcanvas-app'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Publish the core image
        if: github.event_name == 'push' && github.repository == 'cyberriskcanvas/cyberriskcanvas-app'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
