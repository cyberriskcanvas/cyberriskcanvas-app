services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cyberrisk
      POSTGRES_USER: cyberrisk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cyberrisk']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/cyberriskcanvas/cyberriskcanvas-app:latest
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      - documents_data:/data/documents
    environment:
      # ── Database ────────────────────────────────────────────────────────────
      DATABASE_URL: postgresql://cyberrisk:${POSTGRES_PASSWORD}@db:5432/cyberrisk

      # ── Auth ─────────────────────────────────────────────────────────────────
      # Generate with: openssl rand -base64 32
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      AUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${APP_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: 'true'

      # ── First Admin User (created automatically on first start) ──────────────
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}

      # ── Redis ────────────────────────────────────────────────────────────────
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  # Optional periodic CVE re-scan. Disabled by default - enable with:
  #   CVE_SCAN_SECRET=... docker compose --profile cve-scan up -d
  # (set CVE_SCAN_SECRET in your .env; must match the value the `app`
  # service uses, see .env.example).
  #
  # NOTE: once started this container restarts itself (unless-stopped) and
  # keeps running on every later `docker compose up -d`, profile or not -
  # simply leaving off `--profile cve-scan` does NOT stop it. To actually
  # disable it again:
  #   docker compose stop cve-scan && docker compose rm -f cve-scan
  cve-scan:
    image: curlimages/curl:8.20.0
    restart: unless-stopped
    profiles: ['cve-scan']
    environment:
      CVE_SCAN_SECRET: ${CVE_SCAN_SECRET:?Set CVE_SCAN_SECRET to use the cve-scan profile}
      CVE_SCAN_INTERVAL_SECONDS: ${CVE_SCAN_INTERVAL_SECONDS:-21600}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        while true; do
          echo "[cve-scan] $(date -u +%Y-%m-%dT%H:%M:%SZ) triggering scan…"
          curl -fsS -o /dev/null -w '[cve-scan] HTTP %{http_code}\n' \
            -X POST -H "Authorization: Bearer $$CVE_SCAN_SECRET" \
            http://app:3000/api/internal/cve-scan \
          || echo "[cve-scan] request failed"
          sleep "$$CVE_SCAN_INTERVAL_SECONDS"
        done
    depends_on:
      - app
    networks:
      - internal

networks:
  internal:

volumes:
  postgres_data:
  documents_data:
